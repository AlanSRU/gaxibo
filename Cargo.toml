[package]
name = "arexibo"
description = "A client (player) for the Xibo signage system"
version = "0.5.1"
rust-version = "1.75"
edition = "2021"
authors = ["Georg Brandl <g.brandl@fz-juelich.de>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/birkenfeld/arexibo"
keywords = ["xibo", "signage", "qt"]

[[bin]]
name = "arexibo"
path = "src/main.rs"

[dependencies]
# general
anyhow = "1.0"
base64 = "0.22"
byteorder = "1.5.0"
time = { version = "<=0.3.41", features = ["parsing", "formatting", "local-offset", "serde"] }
once_cell = "1.21"
clap = { version = "<4.6", features = ["cargo", "derive"] }
clap_lex = { version = "<1.1" }
crossbeam-channel = "0.5"
parking_lot = "0.12"
hex = "0.4"
itertools = "0.14"
log = "0.4"
nix = { version = "0.31", features = ["fs", "hostname"] }
rand = "0.8"
dbus = "0.9"

# video
# GStreamer, for the video path that replaces QtWebEngine's decode.  Pinned to
# a 0.23.x that builds against the trixie GStreamer 1.26 the image ships.
gstreamer = "0.23"
# For GstVideoOverlay: set_window_handle and set_render_rectangle are what put
# a clip in a region rather than only full-screen.
gstreamer-video = "0.23"

# wayland
# One toplevel shared by every sink, so the page and a clip can be on screen
# together.  wayland-client must use the *system* backend, sharing
# libwayland-client with GStreamer: with the pure-Rust backend the pointer from
# ObjectId::as_ptr() is not a wl_surface* the sink's C code can use.
#
# Upper bound for the same reason clap and time carry one: the image builds with
# Debian trixie's cargo, which is 1.85 and cannot be changed by a
# rust-toolchain pin because there is no rustup in the builder.
# wayland-protocols 0.32.13 raised its MSRV to 1.86 and fails to resolve there.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "<=0.32.12", features = ["client"] }

# crypto
arc4 = "0.1"
md-5 = "0.10"
rsa = "0.9"

# file formats
elementtree = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# network
tiny_http = "0.12"
ureq = { version = "<3.3", features = ["socks-proxy"] }
tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
rustls-pki-types = "1.14.1"
webpki-roots = "1.0.7"

# commands
serialport = "4.8"
regex = "1.12"
shlex = "1.3"
subprocess = "<=0.2.9"

# MSRV
base64ct = "~1.6"
rayon = "~1.10"
rayon-core = "~1.12"
indexmap = "~2.11"

[build-dependencies]
cmake = "0.1"
shlex = "1.3"
elementtree = "1.2"

[features]
